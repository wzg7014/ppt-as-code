name: Bug report
description: Report a problem with the workflow, docs, or tools
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, agent used, and relevant files.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: Claude Code / Codex / Cursor / other
  - type: input
    id: model
    attributes:
      label: Image model or API
      placeholder: Gemini / OpenAI / other
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Add screenshots, prompts, or error messages if useful.
